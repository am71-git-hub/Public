# ~/.tmux.conf — example config
# tmux 3.2a

# ── general ────────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc"   # truecolor passthrough
set  -g history-limit 50000
set  -g mouse on
set  -g base-index 1                                # windows start at 1
setw -g pane-base-index 1                           # panes too
set  -g renumber-windows on                         # close gaps in window nums
set  -s escape-time 0                               # snappier vim/nvim
set  -g focus-events on

# ── prefix ─────────────────────────────────────────────────────────────
# default Ctrl-b kept on purpose (matches every guide online)
set -g prefix C-b
bind C-b send-prefix

# ── reload config ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ── splits open in current path; pipe = vertical, dash = horizontal ────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new window also opens in current path
bind c new-window -c "#{pane_current_path}"

# ── vim-style pane navigation (prefix + h/j/k/l) ───────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── vi-style copy mode ─────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── status bar ─────────────────────────────────────────────────────────
# light bar — light purple bg, dark purple text
set -g status-interval 0   # disable tmux's own tick — refresher.sh drives all redraws
set -g @spinner '⠋'        # initial spinner frame (refresher.sh updates it)
run-shell -b '~/.tmux/refresher.sh'
set -g status-style "bg=colour189,fg=colour54"                        # light purple bar, dark purple text
set -g status-left  " #[bold]#S #[nobold]| "
set -g status-right "%Y-%m-%d %H:%M "
set -g status-left-length 30

# Per-window @claude-state is set by Claude hooks via ~/.tmux/claude-state.sh:
#   thinking → spinner    waiting → ❓    done → ✅
# Plus tmux's own flags (- last, Z zoomed, M marked). Bell/activity flags
# are off (we get state directly from Claude, no need to guess from output).
setw -g window-status-format         "#I:#W#{?#{!=:#{@claude-state},},#{?#{==:#{@claude-state},thinking},#{@spinner},#{?#{==:#{@claude-state},waiting},❓,#{?#{==:#{@claude-state},done},✅,}}},}#{?window_last_flag,-,}#{?window_zoomed_flag,Z,}#{?window_marked_flag,M,}"
setw -g window-status-current-format "#I:#W#{?#{==:#{@claude-state},thinking},#{@spinner},}*#{?window_zoomed_flag,Z,}#{?window_marked_flag,M,}"
setw -g window-status-style          "bg=colour189,fg=colour54"       # inactive windows: same bg, purple text
setw -g window-status-current-style  "bg=colour189,fg=colour16,bold"  # current: same bg, bold black

setw -g monitor-activity off
setw -g monitor-bell off
set  -g visual-activity off
set  -g visual-bell off
set  -g bell-action none

# Clear ✅/❓ once you look at the window (switch to it, or switch session to it).
# Leaves "thinking" alone — that reflects Claude state, not user attention.
set-hook -g after-select-window   'if -F "#{||:#{==:#{@claude-state},done},#{==:#{@claude-state},waiting}}" "set-option -wq -u @claude-state"'
set-hook -g client-session-changed 'if -F "#{||:#{==:#{@claude-state},done},#{==:#{@claude-state},waiting}}" "set-option -wq -u @claude-state"'
